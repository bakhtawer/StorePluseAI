    <script>
      // Compatibility shim to ensure window.fetch has both getter and setter.
      // This prevents "Cannot set property fetch of #<Window> which has only a getter"
      // when test harnesses or browser extensions attempt to assign to window.fetch.
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch setter shim could not be initialized:', e);
        }
      })();
    </script>
